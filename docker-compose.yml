version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaming_live_rag_app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - SLRAG_CORPUS_ISOLATION=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
